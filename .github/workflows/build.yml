name: Build DroidDesk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Türkçe yamasının sonucunu depoya geri kaydedebilmek için yazma izni
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Türkçeleştirme + tüm depolar ──
      # turkcelestir.py depoda varsa çalışır. Birden fazla kez çalışması
      # güvenlidir; zaten uygulanmış değişiklikleri atlar.
      - name: Türkçe yamasını uygula
        run: |
          if [ -f turkcelestir.py ]; then
            python3 turkcelestir.py
          else
            echo "turkcelestir.py bulunamadı, yama atlandı."
          fi

      # Yama yeni değişiklik yaptıysa kodu depoya kaydeder; böylece
      # depodaki kaynak kod da kalıcı olarak Türkçe olur.
      - name: Değişiklikleri depoya kaydet
        run: |
          if [ -n "$(git status --porcelain -- app)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app
            git commit -m "Türkçeleştirme ve tüm depolar yaması uygulandı"
            git push
          else
            echo "Kaydedilecek yeni değişiklik yok."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-tr
          path: app/build/app/outputs/flutter-apk/app-release.apk
